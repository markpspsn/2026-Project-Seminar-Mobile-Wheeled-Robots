amcl:
  ros__parameters:
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    set_initial_pose: false
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 1000
    update_min_d: 0.05
    update_min_a: 0.05
    laser_model_type: likelihood_field
    sigma_hit: 0.1
    laser_max_range: 3.5
    laser_likelihood_max_dist: 1.0
    max_beams: 120
    z_hit: 0.95
    z_rand: 0.05
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
